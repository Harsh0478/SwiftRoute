name: swiftroute_customer
description: SwiftRoute Package Delivery & Logistics Customer App
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  mapbox_maps_flutter: ^3.36.0-rc.1
  geolocator: ^13.0.1
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  razorpay_flutter: ^1.3.7
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121217"
  adaptive_icon_foreground: "assets/icon/icon.png"